# TukiFact — Production Compose (shared VPS, nginx-proxy + acme-companion gateway)
#
# Lives in /opt/tukifact on 184.174.39.116. The HTTPS gateway runs separately
# and discovers containers on the external `web` network via VIRTUAL_HOST /
# LETSENCRYPT_HOST envs.
#
# Subdomain routing (matches existing patterns of starbuybaby / expertia / etc.):
#   tukifact.com.pe + www.tukifact.com.pe + app.tukifact.com.pe  → web
#   api.tukifact.com.pe                                           → api
#
# Envs are loaded from .env.prod (see .env.prod.example).

services:
  postgres:
    image: postgres:18
    container_name: tukifact-postgres
    restart: always
    environment:
      POSTGRES_DB: ${PG_DATABASE:-tukifact}
      POSTGRES_USER: ${PG_USER:-tukifact}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-tukifact} -d ${PG_DATABASE:-tukifact}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  nats:
    image: nats:latest
    container_name: tukifact-nats
    restart: always
    command: ["-js", "-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats_data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf
    healthcheck:
      test: ["CMD", "nats-server", "-c", "/etc/nats/nats-server.conf", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: tukifact-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD};
      mc mb local/tukifact-xml --ignore-existing;
      mc mb local/tukifact-pdf --ignore-existing;
      mc mb local/tukifact-cdr --ignore-existing;
      mc mb local/tukifact-certs --ignore-existing;
      echo 'Buckets ready';
      "
    environment:
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: tukifact-api
    restart: always
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${PG_DATABASE:-tukifact};Username=${PG_USER:-tukifact};Password=${PG_PASSWORD};Include Error Detail=false"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: "TukiFact"
      Jwt__Audience: "TukiFact"
      Nats__Url: "nats://nats:4222"
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: ${MINIO_USER}
      MinIO__SecretKey: ${MINIO_PASSWORD}
      AllowedHosts: ${ALLOWED_HOSTS:-api.tukifact.com.pe}
      Cors__FrontendUrl: ${CORS_FRONTEND_URL:-https://tukifact.com.pe,https://www.tukifact.com.pe,https://app.tukifact.com.pe}
      Sunat__Environment: ${SUNAT_ENV:-beta}
      Decolecta__ApiKey: ${DECOLECTA_API_KEY:-}
      Culqi__SecretKey: ${CULQI_SECRET_KEY:-}
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:-}
      Sentry__Dsn: ${SENTRY_DSN:-}
      # Seed of first tenant + admin (only runs if Tenants table is empty)
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-administrations@tukisolutions.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Eth@N2505}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administracion TukiSolutions}
      SEED_TENANT_RUC: ${SEED_TENANT_RUC:-20613614509}
      SEED_TENANT_RAZON_SOCIAL: ${SEED_TENANT_RAZON_SOCIAL:-Tukituki Solutions SAC}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-administrations@tukisolutions.com}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-Eth@N2505}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-Super Admin}
      # nginx-proxy discovery
      VIRTUAL_HOST: api.tukifact.com.pe
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: api.tukifact.com.pe
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-jaimeandre17@hotmail.com}
    volumes:
      - api_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
      - gateway

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # NEXT_PUBLIC_* values must be baked at build time for the standalone bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.tukifact.com.pe}
        NEXT_PUBLIC_PUBLIC_URL: ${NEXT_PUBLIC_PUBLIC_URL:-https://tukifact.com.pe}
        NEXT_PUBLIC_CULQI_PUBLIC_KEY: ${NEXT_PUBLIC_CULQI_PUBLIC_KEY:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-tukifact.com.pe}
    container_name: tukifact-web
    restart: always
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.tukifact.com.pe}
      NEXT_PUBLIC_PUBLIC_URL: ${NEXT_PUBLIC_PUBLIC_URL:-https://tukifact.com.pe}
      NEXT_PUBLIC_CULQI_PUBLIC_KEY: ${NEXT_PUBLIC_CULQI_PUBLIC_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-tukifact.com.pe}
      # Next middleware (src/middleware.ts) splits marketing vs portal by Host.
      VIRTUAL_HOST: tukifact.com.pe,www.tukifact.com.pe,app.tukifact.com.pe
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: tukifact.com.pe,www.tukifact.com.pe,app.tukifact.com.pe
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-jaimeandre17@hotmail.com}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gateway

  ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    container_name: tukifact-ai
    restart: always
    environment:
      TUKIFACT_NATS_URL: "nats://nats:4222"
      TUKIFACT_API_BASE_URL: "http://api:8080"
      TUKIFACT_AI_PROVIDER: ${AI_PROVIDER:-stub}
      TUKIFACT_AI_API_KEY: ${AI_API_KEY:-}
      TUKIFACT_AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8090/health').raise_for_status()\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - internal
    init: true
    pids_limit: 256
    cpus: "1.5"
    mem_limit: 512m

volumes:
  postgres_data:
  nats_data:
  minio_data:
  api_keys:

networks:
  internal:
    driver: bridge
  gateway:
    external: true
    name: web
