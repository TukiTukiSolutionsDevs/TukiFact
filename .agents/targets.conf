# Adaptadores por CLI. Agregar una CLI = agregar líneas; los scripts no cambian.
#
# Columnas (separadas por espacios o tabs):
#   cli          nombre lógico usado por --cli
#   scope        project (rutas relativas a la raíz del repo) | user (~ = $HOME)
#   kind         native | skills-symlink | instructions-import | gemini-settings
#   destination  carpeta o archivo que gestiona el adaptador
#   binary       ejecutable para `status` (command -v); "-" si no aplica
#
# Tipos:
#   native               la CLI ya lee .agents/skills; no se crea nada.
#   skills-symlink       un symlink por skill: destination/<name> -> .agents/skills/<name>
#                        (relativo en project, absoluto en user).
#   instructions-import  el archivo debe contener la línea exacta "@AGENTS.md".
#   gemini-settings      settings.json con context.fileName que incluya AGENTS.md.

# cli      scope    kind                 destination             binary
claude     project  skills-symlink       .claude/skills          claude
claude     project  instructions-import  CLAUDE.md               claude
claude     user     skills-symlink       ~/.claude/skills        claude

opencode   project  native               .agents/skills          opencode
codex      project  native               .agents/skills          codex
pi         project  native               .agents/skills          pi
cursor     project  native               .agents/skills          cursor-agent
kimi       project  native               .agents/skills          kimi

gemini     project  native               .agents/skills          gemini
gemini     project  gemini-settings      .gemini/settings.json   gemini

# ~/.agents/skills lo leen codex, pi, kimi, cursor, opencode y gemini a nivel usuario.
generic    user     skills-symlink       ~/.agents/skills        -
